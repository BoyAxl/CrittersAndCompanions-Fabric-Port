plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = maven_group
version = mod_version

base {
    archivesName = mod_id
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

sourceSets {
    main {
        java {
            srcDir 'common/src/main/java'
            srcDir 'fabric/src/main/java'
            exclude 'com/github/eterdelta/crittersandcompanions/client/model/BubbleModel.java'
            exclude 'com/github/eterdelta/crittersandcompanions/client/model/GrapplingHookModel.java'
            exclude 'com/github/eterdelta/crittersandcompanions/client/renderer/BubbleLayer.java'
            exclude 'com/github/eterdelta/crittersandcompanions/client/renderer/SilkLeashRenderer.java'
            exclude 'com/github/eterdelta/crittersandcompanions/compat/TrinketsCompat.java'
            exclude 'com/github/eterdelta/crittersandcompanions/mixin/ItemPropertiesAccessor.java'
            exclude 'com/github/eterdelta/crittersandcompanions/mixin/LivingEntityRendererMixin.java'
        }
        resources {
            srcDir 'common/src/main/resources'
            srcDir 'fabric/src/main/resources'
        }
    }
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }

    maven {
        url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
        content {
            includeGroup 'fuzs.forgeconfigapiport'
            includeGroup 'net.neoforged.fancymodloader'
            includeGroup 'net.neoforged.neoforge'
        }
    }

    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }

    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_port_version}"
    include "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_port_version}"
    implementation "curse.maven:geckolib-388172:${geckolib_curseforge_file_id}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version    : minecraft_version,
            fabric_loader_version: fabric_loader_version,
            fabric_api_version   : fabric_api_version,
            java_version         : java_version,
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_author           : mod_author,
            mod_version          : mod_version,
            geckolib_version     : geckolib_version,
            forge_config_port_version: forge_config_port_version,
    ]

    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
